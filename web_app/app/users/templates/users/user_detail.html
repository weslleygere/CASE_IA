{% extends "base_navbar.html" %}

{% block title %}Detalhes do Usuário{% endblock title %}

{% block conteudo %}
<div class="container mt-4" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white text-center">
            <h2 class="mb-0">Detalhes do Usuário</h2>
        </div>
        <div class="card-body bg-light">

            <p><strong>Nome Completo:</strong> {{ user.username }}</p>
            <p><strong>E-mail:</strong> {{ user.email }}</p>
            <p><strong>Telefone:</strong> {{ user.last_name }}</p>

            <a href="{% url 'user_edit' user.pk %}" class="btn btn-dark w-100">✏️ Editar</a>
            <a href="{% url 'user_list' %}" class="btn btn-secondary w-100 mt-2">⬅ Voltar à Lista</a>

        </div>
    </div>
</div>
{% endblock conteudo %}
