{% extends "base.html" %}
{% load static %}

{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <form action="{% url 'dashboard' %}" method="get" style="display: inline;">
        <button type="submit" class="navbar-brand btn btn-link" style="padding: 0; border: none; background: none; text-decoration: none;">
            🏠 Home
        </button>
    </form>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <form action="{% url 'logout' %}" method="post" style="display: inline;">
              {% csrf_token %}
              <button type="submit" class="nav-link text-danger btn btn-link" style="padding: 0; border: none; background: none; text-decoration: none;">
                  🚪 Sair
              </button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</nav>
{% endblock navbar %}

{% block content %}
  {% block conteudo %}{% endblock conteudo %}
{% endblock content %}
